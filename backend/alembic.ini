[alembic]
script_location = alembic
# The real URL is injected from studio.config (DATABASE_URL); this placeholder is never used.
sqlalchemy.url = sqlite:///placeholder.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
