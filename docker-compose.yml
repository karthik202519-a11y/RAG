# RAG - local infrastructure.
#   docker compose up -d            # infra only (postgres, redis, qdrant, minio)
#   docker compose --profile app up -d --build   # + backend, worker, frontend
#
# Credentials below are LOCAL DEVELOPMENT defaults. Override via .env for anything shared.
name: rag-studio

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio_dev}@postgres:5432/${POSTGRES_DB:-studio}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  PGVECTOR_URL: postgresql://${PGVECTOR_USER:-studio}:${PGVECTOR_PASSWORD:-studio_dev}@pgvector:5432/${PGVECTOR_DATABASE:-rag_vectors}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-studio_dev_secret}
  S3_BUCKET: ${S3_BUCKET:-studio-artifacts}
  STUDIO_SECRET_KEY: ${STUDIO_SECRET_KEY:-}  # empty = backend generates and persists one
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
  AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
  AZURE_OPENAI_CHAT_DEPLOYMENTS: ${AZURE_OPENAI_CHAT_DEPLOYMENTS:-}
  AZURE_OPENAI_VISION_DEPLOYMENT: ${AZURE_OPENAI_VISION_DEPLOYMENT:-}
  AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
  AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
  FASTEMBED_MODEL: ${FASTEMBED_MODEL:-BAAI/bge-small-en-v1.5}
  FASTEMBED_RERANK_MODEL: ${FASTEMBED_RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-haiku-4-5}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.0-flash}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  COHERE_EMBEDDING_MODEL: ${COHERE_EMBEDDING_MODEL:-embed-english-v3.0}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}

services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 plus the pgvector extension (same data format as postgres:16)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    ports: ["127.0.0.1:5433:5432"]  # 5433 on the host: 5432 is often reserved/used on Windows
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio} -d ${POSTGRES_DB:-studio}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-studio}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-studio_dev}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-rag_vectors}
    ports: ["127.0.0.1:5435:5432"]
    volumes: [pgvectordata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-studio} -d ${PGVECTOR_DATABASE:-rag_vectors}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  minio:
    # MinIO stopped publishing official images to Docker Hub/quay.io in 2025; this is a
    # community mirror of the last Bitnami build. Swap for any S3-compatible store.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-studio_dev_secret}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]  # host ports 9100/9101: 9000 is often taken
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: [app]
    image: rag-studio-api:latest  # the API and the worker share one image
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [studiodata:/data]

  worker:
    profiles: [app]
    image: rag-studio-api:latest
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [studiodata:/data]
    command: celery -A studio.jobs.celery_app worker --pool=threads --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://127.0.0.1:8000}" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  pgvectordata:
  redisdata:
  qdrantdata:
  miniodata:
  studiodata:
